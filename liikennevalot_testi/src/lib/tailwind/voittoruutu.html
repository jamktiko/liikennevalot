<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voittoruutu (Aito Retro)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              pixel: ['"Press Start 2P"', 'cursive'],
            },
          },
        },
      }
    </script>
  
  </head>
  <body class="font-pixel flex min-h-screen items-center justify-center bg-slate-400 p-8">
    
    <div class=" shadow-2xl flex aspect-square w-[500px] flex-col items-center justify-start gap-12 border-[6px] border-black bg-[#9dc2e0] p-12 text-center backdrop-blur-xl  ">
      
      <div class="text-pixel-shadow leading-tight uppercase">
        <h1 class="mb-4 text-3xl font-['Press_Start_2P'] [text-shadow:3px_3px_0px_rgba(0,0,0,0.3)] font-bold tracking-widest text-black">Voitit!</h1>
        <h2 class="text-2xl font-['Press_Start_2P'] [text-shadow:3px_3px_0px_rgba(0,0,0,0.3)] font-bold tracking-widest text-black">(Pelaajan nimi)</h2>
      </div>

    <div class="w-32 h-32 md:w-28 md:h-28 bg-[#c0c0c0] border-[4px] border-black flex-shrink-0 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.25)),_inset_0_-8px_0_rgba(0,0,0,0.3)]"></div>

      <div class="mb-4 w-full max-w-[400px] space-y-6">
        <button class="btn-shadow w-full border-4 border-black bg-white py-4 text-[12px] font-['Press_Start_2P'] [text-shadow:3px_3px_0px_rgba(0,0,0,0.3)]  font-bold uppercase transition-all hover:bg-gray-50 active:translate-y-1 active:bg-gray-100 flex-shrink-0 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.25)),_inset_0_-6px_0_rgba(0,0,0,0.3)]"> 
          Takaisin alkuun
        </button>
        <button class="btn-shadow w-full border-4 border-black bg-white py-4 text-[12px] font-['Press_Start_2P'] [text-shadow:3px_3px_0px_rgba(0,0,0,0.3)] font-bold uppercase transition-all hover:bg-gray-50 active:translate-y-1 active:bg-gray-100 flex-shrink-0 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.25)),_inset_0_-6px_0_rgba(0,0,0,0.3)] ">
          Pelaa uudelleen
        </button>
      </div>
    </div>
  </body>
</html>
